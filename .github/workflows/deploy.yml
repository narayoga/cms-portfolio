#deploy backend
name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend-express/**'
      - '.github/workflows/deploy.yml'

env:
  IMAGE_NAME: ghcr.io/narayoga/cms-portfolio-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-express
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Update container on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop cms-portfolio-backend || true
            docker rm cms-portfolio-backend || true
            docker run -d \
              --name cms-portfolio-backend \
              --restart unless-stopped \
              --env-file ~/cms-api/.env \
              -p 127.0.0.1:8000:8000 \
              -v ~/cms-api/uploads:/app/public/uploads \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f
