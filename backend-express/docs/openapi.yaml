          example: /uploads/downloads/thumbnails/catalogue-2026-556677.jpg
        file_path:
          type: string
          nullable: true
          example: /uploads/downloads/files/catalogue-2026-889900.pdf
    PublicServicePage:
      type: object
      properties:
        content_html:
          type: string
          nullable: true
          example: <h2>Installation and maintenance</h2><p>Our team installs every product we sell.</p>
        hero_image:
          type: string
          nullable: true
          example: /uploads/site/services/services-hero-abcdef.jpg
    PublicSettings:
      type: object
      description: Only these keys can appear; keys that are not set are left out.
      properties:
        site_name:
          type: string
          nullable: true
          example: Portfolio CMS
        contact_email:
          type: string
          nullable: true
          example: info@example.com
        contact_phone:
          type: string
          nullable: true
          example: '+62 21 555 0100'
        contact_address:
          type: string
          nullable: true
          example: Jl. Contoh No. 1, Jakarta
        ga_id:
          type: string
          nullable: true
          example: G-XXXXXXXXXX
        social_facebook:
          type: string
          nullable: true
          example: https://facebook.com/example
        social_instagram:
          type: string
          nullable: true
          example: https://instagram.com/example
        social_linkedin:
          type: string
          nullable: true
          example: https://linkedin.com/company/example
    PublicNavMenuLink:
      type: object
      properties:
        id:
          type: integer
          example: 8
        label:
          type: string
          example: Projects
        url:
          type: string
          example: /projects
    PublicNavMenus:
      type: object
      description: The three menus are always present (an empty list when a menu has no active links).
      required: [header, footer_explore, footer_resources]
      properties:
        header:
          type: array
          items:
            $ref: '#/components/schemas/PublicNavMenuLink'
        footer_explore:
          type: array
          items:
            $ref: '#/components/schemas/PublicNavMenuLink'
        footer_resources:
          type: array
          items:
            $ref: '#/components/schemas/PublicNavMenuLink'
