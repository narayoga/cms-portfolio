          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Sub-subcategories]
      summary: Update a catalog item
      description: Fields that are not sent keep their current value. Sending "advantages" or "features" replaces the whole list. Send parent_id null to move the item to the top level.
      operationId: updateSubSubcategory
      security:
        - bearerAuth: []
