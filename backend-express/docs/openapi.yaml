      tags: [Sub-subcategories]
      summary: Create a catalog item
      description: Advantages and features are saved when they are sent as arrays.
      operationId: createSubSubcategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SubSubcategoryInput'
                - required: [name, subcategory_id]
      responses:
        '200':
          $ref: '#/components/responses/OkIdSlug'
