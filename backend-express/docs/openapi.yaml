    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Sub-subcategories]
      summary: Get one catalog item
      description: The item with its advantages and features (feature images as an array).
      operationId: getSubSubcategory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The catalog item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
