openapi: 3.0.3

info:
  title: Portfolio CMS API
  version: 1.0.0
  description: |
    REST API for the portfolio website and its admin panel (Express 5 + TypeScript).

    ## Response format (the "envelope")

    Every response is JSON and always has the same outer shape.

    Success (HTTP 200):

    ```json
    { "ok": true, "data": { "id": 12, "slug": "park-hyatt-jakarta" } }
    ```

    Error (HTTP 4xx / 5xx):

    ```json
    { "ok": false, "error": "Missing field: title" }
    ```

    So you can always check `ok` first. When `ok` is `true`, read `data`
    (it can be an object, a list, or `null`). When `ok` is `false`, show `error`.

    Errors that can happen on any route:

    - `400 Invalid JSON body` - the body is not valid JSON.
    - `413 Request body too large` - the JSON body is bigger than 10 MB.
    - `404 Not found` - the URL does not exist.
    - `500 Server error` or `500 Database connection failed`.

    ## Rate limits

    Two routes are limited per IP address, and answer `429` when the limit is reached
    (the `Retry-After` header says how many seconds to wait):

    - **POST /api/auth/login** - 10 failed logins per 15 minutes (successful logins are not counted).
    - **POST /api/public/contact** - 5 messages per hour.

    ## How to log in

    1. Open **POST /api/auth/login** below, click **Try it out**, enter your email and password, and click **Execute**.
    2. Copy the `token` value from the response (`data.token`).
    3. Click the **Authorize** button at the top of this page and paste the token (without the word "Bearer").
    4. Now all routes with a lock icon will send `Authorization: Bearer <token>` for you.

    Tokens expire after 24 hours by default (the `JWT_TTL` setting). Without a valid token,
    protected routes answer `401 Unauthorized`.

    ## Roles

    - **admin** - can use every route, including user management (`/api/admin/users`).
    - **editor** - can use every admin route except user management. Calling a users route
      as an editor answers `403 Forbidden`.

    Routes under `/api/public/...` and `/api/health` need no login.

    ## Good to know

    - On update (PUT) routes you only need to send the fields you want to change. A field that is
      missing (or `null`) keeps its current value, unless the route says otherwise.
    - `is_active` is `1` (shown on the website) or `0` (hidden). In request bodies, `0`, `"0"`, `false`
      and `""` all mean hidden; anything else means shown.
    - Delete routes do not check whether the row exists; they always answer `ok: true`.
    - Image and file paths look like `/uploads/projects/park-hyatt-k3f9a2.jpg`. Upload the file first
      with **POST /api/admin/upload**, then save the returned `path` in the item.

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Auth
    description: Log in and check who is logged in.
  - name: Public
    description: Read-only data for the public website. No login needed.
  - name: Contact
    description: The public contact form.
  - name: Users
    description: Admin panel user accounts (admin role only).
  - name: Categories
    description: Top level of the product catalog.
  - name: Subcategories
    description: Second level of the product catalog (inside a category).
  - name: Sub-subcategories
    description: Catalog items inside a subcategory. An item is a "group" (has child items) or a "product" (has advantages and features).
  - name: Products
    description: Product pages inside a subcategory, with a gallery of images.
  - name: Projects
    description: Reference projects (for example hotels and offices).
  - name: Publications
    description: News and articles.
  - name: Downloads
    description: Catalogues and manuals in the download center.
  - name: Service page
    description: The single Services page.
  - name: Settings
    description: Site-wide key/value settings.
  - name: Banners
    description: Homepage hero banners.
  - name: Nav menus
    description: Links in the header and footer menus.
  - name: Upload
    description: Upload images and documents.
  - name: Health
    description: Check that the server is running.

paths:
  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Checks email and password and returns a login token (JWT) plus the user.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: Invalid credentials
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: "Too many failed logins from this IP (default 10 per 15 minutes; successful logins are not counted). The Retry-After header says how many seconds to wait."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Too many login attempts, please try again later"
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the logged in user
      description: Returns the user stored inside the token (no database lookup).
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The logged in user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Public (website)
  # ---------------------------------------------------------------------------
  /api/public/homepage:
    get:
      tags: [Public]
      summary: Homepage data
      description: Active banners, up to 8 categories, up to 20 projects, story milestones, partner brands and homepage settings.
      operationId: getPublicHomepage
      responses:
        '200':
          description: Everything the homepage needs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicHomepage'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/categories:
    get:
      tags: [Public]
      summary: List categories
      description: Every active category with its active subcategories.
      operationId: getPublicCategories
      responses:
        '200':
          description: List of categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicCategory'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/categories/{slug}:
    get:
      tags: [Public]
      summary: Get one category
      description: One active category by slug, with its active subcategories.
      operationId: getPublicCategoryDetail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicCategoryDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/subcategories/{catSlug}/{subSlug}:
    get:
      tags: [Public]
      summary: Get one subcategory
      description: One active subcategory with its top-level catalog items and its products.
      operationId: getPublicSubcategoryDetail
      parameters:
        - $ref: '#/components/parameters/CatSlug'
        - $ref: '#/components/parameters/SubSlug'
      responses:
        '200':
          description: The subcategory.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicSubcategoryDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/subsubcategories/{catSlug}/{subSlug}/{subSubSlug}:
    get:
      tags: [Public]
      summary: Get one top-level catalog item
      description: A catalog item directly inside a subcategory. Groups list their children; products have advantages and features.
      operationId: getPublicSubSubcategoryDetail
      parameters:
        - $ref: '#/components/parameters/CatSlug'
        - $ref: '#/components/parameters/SubSlug'
        - $ref: '#/components/parameters/SubSubSlug'
      responses:
        '200':
          description: The catalog item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicSubSubcategoryDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/subsubcategories/{catSlug}/{subSlug}/{subSubSlug}/{leafSlug}:
    get:
      tags: [Public]
      summary: Get one nested catalog item
      description: A catalog item inside a group item (4th level), with advantages and features.
      operationId: getPublicSubSubProductDetail
      parameters:
        - $ref: '#/components/parameters/CatSlug'
        - $ref: '#/components/parameters/SubSlug'
        - $ref: '#/components/parameters/SubSubSlug'
        - $ref: '#/components/parameters/LeafSlug'
      responses:
        '200':
          description: The nested catalog item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicSubSubProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/products/{catSlug}/{subSlug}/{prodSlug}:
    get:
      tags: [Public]
      summary: Get one product
      description: One active product with its gallery images.
      operationId: getPublicProductDetail
      parameters:
        - $ref: '#/components/parameters/CatSlug'
        - $ref: '#/components/parameters/SubSlug'
        - $ref: '#/components/parameters/ProdSlug'
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicProductDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/projects:
    get:
      tags: [Public]
      summary: List projects (paged)
      description: Active projects, newest first.
      operationId: getPublicProjects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of projects.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicProjectPage'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/projects/{slug}:
    get:
      tags: [Public]
      summary: Get one project
      operationId: getPublicProjectDetail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The project (every column).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/publications:
    get:
      tags: [Public]
      summary: List publications (paged)
      description: Active publications, newest first.
      operationId: getPublicPublications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of publications.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicPublicationPage'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/publications/{slug}:
    get:
      tags: [Public]
      summary: Get one publication
      operationId: getPublicPublicationDetail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The publication (every column).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Publication'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/downloads:
    get:
      tags: [Public]
      summary: List downloads
      description: Every active download (catalogues and manuals).
      operationId: getPublicDownloads
      responses:
        '200':
          description: List of downloads.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PublicDownload'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/service:
    get:
      tags: [Public]
      summary: Get the Services page
      description: Returns empty content when the page was never saved.
      operationId: getPublicServicePage
      responses:
        '200':
          description: The Services page content.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicServicePage'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/settings:
    get:
      tags: [Public]
      summary: Get public settings
      description: Only the settings that are safe to show to visitors. Keys that are not set are left out.
      operationId: getPublicSettings
      responses:
        '200':
          description: Public settings as one object.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicSettings'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/public/nav-menus:
    get:
      tags: [Public]
      summary: Get menu links
      description: Active menu links grouped by location (header, footer_explore, footer_resources).
      operationId: getPublicNavMenus
      responses:
        '200':
          description: Menu links grouped by location.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublicNavMenus'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Contact
  # ---------------------------------------------------------------------------
  /api/public/contact:
    post:
      tags: [Contact]
      summary: Send the contact form
      description: Emails the message to the site admin. If the hidden "website" field is filled in (a bot), it answers ok with data null but sends nothing.
      operationId: submitContactForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '200':
          description: 'Message sent (data is `{ "sent": true }`), or ignored because the honeypot was filled (data is `null`).'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        nullable: true
                        properties:
                          sent:
                            type: boolean
                            example: true
              example:
                ok: true
                data:
                  sent: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: A required field is missing, or the email is not valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  value:
                    ok: false
                    error: 'Missing field: email'
                invalidEmail:
                  value:
                    ok: false
                    error: Invalid email
        '429':
          description: "Too many messages from this IP (default 5 per hour). The Retry-After header says how many seconds to wait."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Too many messages, please try again later"
        '500':
          description: The email could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: Failed to send message

  # ---------------------------------------------------------------------------
  # Users (admin only)
  # ---------------------------------------------------------------------------
  /api/admin/users:
    get:
      tags: [Users]
      summary: List users
      description: Every user, without password hashes. Admin only.
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Users]
      summary: Create a user
      description: Admin only. The password is stored as a bcrypt hash.
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another user already uses this email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: Email already exists
        '422':
          description: "A required field is missing, the role is not admin/editor, or the email is not valid."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example1:
                  value:
                    ok: false
                    error: "Missing field: email"
                example2:
                  value:
                    ok: false
                    error: "Invalid role"
                example3:
                  value:
                    ok: false
                    error: "Invalid email"
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Users]
      summary: Update a user
      description: "Admin only. Only the fields you send are changed. An empty password keeps the current one. Sending the user's own (unchanged) email is fine."
      operationId: updateUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "The email already belongs to another user."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Email already exists"
        '422':
          description: "Nothing to update, the role is not admin/editor, or the email is not valid."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example1:
                  value:
                    ok: false
                    error: "Nothing to update"
                example2:
                  value:
                    ok: false
                    error: "Invalid role"
                example3:
                  value:
                    ok: false
                    error: "Invalid email"
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Users]
      summary: Delete a user
      description: Admin only. You cannot delete your own account.
      operationId: deleteUser
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          description: You tried to delete your own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: Cannot delete yourself
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "There is no row with this id."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Not found"
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Categories
  # ---------------------------------------------------------------------------
  /api/admin/categories:
    get:
      tags: [Categories]
      summary: List categories
      description: Every category (active and hidden), sorted by sort_order.
      operationId: listCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of categories.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Categories]
      summary: Create a category
      description: When slug is not sent it is made from the name. A number is added when the slug is already used.
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CategoryInput'
                - required: [name]
      responses:
        '200':
          $ref: '#/components/responses/OkIdSlug'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Categories]
      summary: Update a category
      description: Fields that are not sent keep their current value.
      operationId: updateCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Categories]
      summary: Delete a category
      description: Also deletes its subcategories, catalog items and products (database cascade).
      operationId: deleteCategory
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OkNull'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "There is no row with this id."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Not found"
