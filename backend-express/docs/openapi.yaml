          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: "The subcategory does not exist, or parent_id is not a group in the same subcategory (or is the item itself). The parent is only checked when parent_id or subcategory_id is sent."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example1:
                  value:
                    ok: false
                    error: "Subcategory not found"
                example2:
                  value:
                    ok: false
                    error: "Parent not found"
                example3:
                  value:
                    ok: false
                    error: "Parent must be a group"
                example4:
                  value:
                    ok: false
                    error: "Parent must be in the same subcategory"
                example5:
                  value:
                    ok: false
                    error: "An item cannot be its own parent"
                example6:
                  value:
                    ok: false
                    error: "Invalid type"
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Sub-subcategories]
      summary: Delete a catalog item
