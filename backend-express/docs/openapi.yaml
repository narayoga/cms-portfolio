          description: "A required field is missing, the subcategory does not exist, or parent_id is not a group in the same subcategory."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                example1:
                  value:
                    ok: false
                    error: "Missing field: subcategory_id"
                example2:
                  value:
                    ok: false
                    error: "Subcategory not found"
                example3:
                  value:
                    ok: false
                    error: "Parent not found"
                example4:
                  value:
                    ok: false
                    error: "Parent must be a group"
                example5:
                  value:
                    ok: false
                    error: "Parent must be in the same subcategory"
                example6:
                  value:
                    ok: false
                    error: "Invalid type"
        '500':
          $ref: '#/components/responses/ServerError'

