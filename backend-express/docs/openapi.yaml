        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsInput'
      responses:
        '200':
          $ref: '#/components/responses/OkNull'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Banners
  # ---------------------------------------------------------------------------
  /api/admin/banners:
    get:
      tags: [Banners]
      summary: List banners
      description: Every homepage banner (active and hidden), sorted by sort_order.
      operationId: listBanners
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of banners.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Banner'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Banners]
      summary: Create a banner
      operationId: createBanner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BannerInput'
                - required: [image_path]
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/banners/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Banners]
      summary: Update a banner
      description: Fields that are not sent keep their current value.
      operationId: updateBanner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerInput'
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Banners]
      summary: Delete a banner
      operationId: deleteBanner
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OkNull'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "There is no row with this id."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Not found"
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Nav menus
  # ---------------------------------------------------------------------------
  /api/admin/nav-menus:
    get:
      tags: [Nav menus]
      summary: List menu links
      description: Every menu link (active and hidden). Use location to show only one menu.
      operationId: listNavMenus
      security:
        - bearerAuth: []
      parameters:
        - name: location
          in: query
          required: false
          description: Only return links of this menu. Leave empty for all.
          schema:
            type: string
            enum: [header, footer_explore, footer_resources]
      responses:
        '200':
          description: List of menu links.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NavMenu'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Nav menus]
      summary: Create a menu link
      operationId: createNavMenu
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NavMenuInput'
                - required: [location, label, url]
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: A required field is missing, or the location is not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingField:
                  value:
                    ok: false
                    error: 'Missing field: url'
                invalidLocation:
                  value:
                    ok: false
                    error: Invalid location
        '500':
          $ref: '#/components/responses/ServerError'

  /api/admin/nav-menus/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Nav menus]
      summary: Update a menu link
      description: Fields that are not sent keep their current value.
      operationId: updateNavMenu
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavMenuInput'
      responses:
        '200':
          $ref: '#/components/responses/OkId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: "location is not header, footer_explore or footer_resources."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Invalid location"
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Nav menus]
      summary: Delete a menu link
      operationId: deleteNavMenu
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/OkNull'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: "There is no row with this id."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: "Not found"
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Upload
  # ---------------------------------------------------------------------------
  /api/admin/upload:
    post:
      tags: [Upload]
      summary: Upload a file
      description: Saves the file in /uploads/<folder>/ and returns its public path. Large JPEG and PNG images are resized (longest side max 1600px) and compressed.
      operationId: uploadFile
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          description: |
            Which file types are allowed.
            - `image`: jpg, jpeg, png, webp, gif, svg
            - `file`: pdf, doc, docx, xls, xlsx, ppt, pptx, zip, rar, txt
            - `any` (default): both lists. Any other value also behaves like `any`.
          schema:
            type: string
            enum: [image, file, any]
            default: any
        - name: folder
          in: query
          required: false
          description: The folder inside /uploads to save into. Empty means "misc".
          schema:
            type: string
            default: misc
            enum:
              - site/logo
              - site/mega-menu
              - site/home
              - site/services
              - site/download-center
              - banners
              - brands
              - catalog/categories
              - catalog/subcategories
              - catalog/items
              - catalog/features
              - products
              - projects
              - publications
              - downloads/thumbnails
              - downloads/files
              - story
              - content
              - misc
            example: projects
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (max 10 MB by default, setting UPLOAD_MAX_BYTES).
      responses:
        '200':
          description: File saved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadResult'
        '400':
          description: The multipart form could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: 'Upload error: Unexpected end of form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: The file is bigger than the size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: File too large
        '415':
          description: The file extension is not allowed for this kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error: File type .exe not allowed
        '422':
          description: The folder is not allowed, or no file was sent in the "file" field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidFolder:
                  value:
                    ok: false
                    error: 'Invalid upload folder: secret'
                noFile:
                  value:
                    ok: false
                    error: No file uploaded (file)
        '500':
          $ref: '#/components/responses/ServerError'

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /api/health:
    get:
      tags: [Health]
      summary: Health check
      description: Answers ok when the server is running (does not check the database).
      operationId: healthCheck
      responses:
        '200':
          description: The server is running.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
              example:
                ok: true
                data:
                  status: ok

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the token from POST /api/auth/login (without the word "Bearer").

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: The row id.
      schema:
        type: integer
        example: 12
    Slug:
      name: slug
      in: path
      required: true
      description: The URL slug.
      schema:
        type: string
        example: park-hyatt-jakarta
    CatSlug:
      name: catSlug
      in: path
      required: true
      description: Slug of the category.
      schema:
        type: string
        example: architectural-hardware
    SubSlug:
      name: subSlug
      in: path
      required: true
      description: Slug of the subcategory.
      schema:
        type: string
        example: door-closers
    SubSubSlug:
      name: subSubSlug
      in: path
      required: true
      description: Slug of the top-level catalog item (sub-subcategory).
      schema:
        type: string
        example: overhead-door-closers
    LeafSlug:
      name: leafSlug
      in: path
      required: true
      description: Slug of the catalog item inside the group.
      schema:
        type: string
        example: ts-93-g
    ProdSlug:
      name: prodSlug
      in: path
      required: true
      description: Slug of the product.
      schema:
        type: string
        example: dorma-ts-93
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1. Values below 1 become 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page. Values are kept between 1 and 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12

  responses:
    OkId:
      description: Saved. Returns the id of the row.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OkEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdResult'
          example:
            ok: true
            data:
              id: 12
    OkIdSlug:
      description: Created. Returns the new id and the final (unique) slug.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/OkEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IdSlugResult'
          example:
            ok: true
            data:
              id: 12
              slug: park-hyatt-jakarta
    OkNull:
      description: Done. data is always null.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OkEnvelope'
          example:
            ok: true
            data: null
    BadRequest:
      description: The request body is not valid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: Invalid JSON body
    Unauthorized:
      description: No token, or the token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: Unauthorized
    Forbidden:
      description: You are logged in, but your role is not admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: Forbidden
    NotFound:
      description: Nothing was found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: Not found
    ValidationError:
      description: A required field is missing or empty.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            ok: false
            error: 'Missing field: title'
    ServerError:
      description: Something went wrong on the server, or the database could not be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                ok: false
                error: Server error
            databaseDown:
              value:
                ok: false
                error: Database connection failed

  schemas:
    # -------------------------------------------------------------------------
    # Envelope
    # -------------------------------------------------------------------------
    OkEnvelope:
      type: object
      description: Every successful response. "data" depends on the route (object, list or null).
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        data:
          nullable: true
          description: The result of the request.
    ErrorResponse:
      type: object
      description: Every error response.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
          example: false
        error:
          type: string
          example: 'Missing field: title'
    IdResult:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          example: 12
    IdSlugResult:
      type: object
      required: [id, slug]
      properties:
        id:
          type: integer
          example: 12
        slug:
          type: string
          example: park-hyatt-jakarta
    UploadResult:
      type: object
      required: [path]
      properties:
        path:
          type: string
          example: /uploads/projects/park-hyatt-k3f9a2.jpg

    # -------------------------------------------------------------------------
    # Shared small types
    # -------------------------------------------------------------------------
    ActiveFlag:
      type: integer
      enum: [0, 1]
      description: 1 = shown on the website, 0 = hidden.
      example: 1
    DateTimeText:
      type: string
      description: Date and time as plain text (YYYY-MM-DD HH:MM:SS).
      example: '2026-10-08 13:45:00'

    # -------------------------------------------------------------------------
    # Auth and users
    # -------------------------------------------------------------------------
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          format: password
          example: your-password
    AuthUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Site Admin
        email:
          type: string
          format: email
          example: admin@example.com
        role:
          type: string
          enum: [admin, editor]
          example: admin
    LoginResult:
      type: object
      properties:
        token:
          type: string
          description: The JWT. Send it as "Authorization Bearer <token>".
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOjF9.signature
        user:
          $ref: '#/components/schemas/AuthUser'
    User:
      type: object
      description: A user account as listed by the admin API (the password hash is never returned).
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Content Editor
        email:
          type: string
          format: email
          example: editor@example.com
        role:
          type: string
          enum: [admin, editor]
          example: editor
        created_at:
          $ref: '#/components/schemas/DateTimeText'
    UserCreateInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          example: Content Editor
        email:
          type: string
          format: email
          example: editor@example.com
        password:
          type: string
          format: password
          example: a-strong-password
        role:
          type: string
          enum: [admin, editor]
          example: editor
    UserUpdateInput:
      type: object
      description: Send at least one field. An empty password keeps the current password.
      properties:
        name:
          type: string
          example: Content Editor
        email:
          type: string
          format: email
          example: editor@example.com
        password:
          type: string
          format: password
          example: a-new-password
        role:
          type: string
          enum: [admin, editor]
          example: editor

    # -------------------------------------------------------------------------
    # Contact
    # -------------------------------------------------------------------------
    ContactInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          example: budi@example.com
        subject:
          type: string
          example: Question about door closers
        message:
          type: string
          example: |-
            Hello,
            Do you have the TS 93 door closer in stock?
        website:
          type: string
          description: Hidden anti-spam field. Real visitors leave it empty.
          example: ''

    # -------------------------------------------------------------------------
    # Categories
    # -------------------------------------------------------------------------
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: Architectural Hardware
        slug:
          type: string
          example: architectural-hardware
        description:
          type: string
          nullable: true
          example: Door closers, locks and handles for commercial buildings.
        image_path:
          type: string
          nullable: true
          example: /uploads/catalog/categories/architectural-hardware-a1b2c3.jpg
        sort_order:
          type: integer
          example: 1
        is_active:
          $ref: '#/components/schemas/ActiveFlag'
        created_at:
          $ref: '#/components/schemas/DateTimeText'
        updated_at:
          $ref: '#/components/schemas/DateTimeText'
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          example: Architectural Hardware
        slug:
          type: string
          description: Optional. Made from the name when empty; a number is added when already used.
          example: architectural-hardware
        description:
          type: string
          nullable: true
          example: Door closers, locks and handles for commercial buildings.
        image_path:
          type: string
          nullable: true
          example: /uploads/catalog/categories/architectural-hardware-a1b2c3.jpg
        sort_order:
          type: integer
          example: 1
        is_active:
          $ref: '#/components/schemas/ActiveFlag'

    # -------------------------------------------------------------------------
    # Subcategories
    # -------------------------------------------------------------------------
    Subcategory:
      type: object
      properties:
        id:
          type: integer
          example: 5
        category_id:
          type: integer
          example: 3
        name:
          type: string
          example: Door Closers
        subtitle:
          type: string
          nullable: true
          example: Overhead and floor springs
        slug:
          type: string
          example: door-closers
        description:
          type: string
          nullable: true
          example: Reliable door closers for every door size.
        image_path:
          type: string
          nullable: true
          example: /uploads/catalog/subcategories/door-closers-d4e5f6.jpg
        sort_order:
          type: integer
          example: 1
        is_active:
          $ref: '#/components/schemas/ActiveFlag'
        created_at:
          $ref: '#/components/schemas/DateTimeText'
        updated_at:
          $ref: '#/components/schemas/DateTimeText'
    SubcategoryListItem:
      allOf:
        - $ref: '#/components/schemas/Subcategory'
        - type: object
          properties:
            category_name:
              type: string
              example: Architectural Hardware
    SubcategoryInput:
      type: object
      properties:
        name:
          type: string
          example: Door Closers
        subtitle:
          type: string
          nullable: true
          description: Short line shown under the title on the subcategory page.
          example: Reliable closing for every door
        category_id:
          type: integer
          example: 3
        slug:
          type: string
          description: Optional. Made from the name when empty; must be unique inside the category.
          example: door-closers
        description:
          type: string
          nullable: true
          example: Reliable door closers for every door size.
        image_path:
          type: string
          nullable: true
          example: /uploads/catalog/subcategories/door-closers-d4e5f6.jpg
        sort_order:
          type: integer
          example: 1
        is_active:
          $ref: '#/components/schemas/ActiveFlag'

    # -------------------------------------------------------------------------
    # Sub-subcategories (catalog items)
    # -------------------------------------------------------------------------
    SubSubcategory:
      type: object
      properties:
        id:
          type: integer
          example: 21
        subcategory_id:
          type: integer
          example: 5
        parent_id:
          type: integer
          nullable: true
          description: The group item this item belongs to, or null for a top-level item.
          example: null
        type:
          type: string
          enum: [group, product]
          example: product
        name:
          type: string
          example: Overhead Door Closers
        slug:
          type: string
          example: overhead-door-closers
        description:
          type: string
          nullable: true
          example: Cam-action door closers for heavy doors.
        image_path:
          type: string
          nullable: true
          example: /uploads/catalog/items/overhead-door-closer-7a8b9c.jpg
        brand_logo:
          type: string
          nullable: true
          example: /uploads/brands/dorma-logo-112233.png
        sort_order:
          type: integer
          example: 1
        is_active:
          $ref: '#/components/schemas/ActiveFlag'
        created_at:
          $ref: '#/components/schemas/DateTimeText'
    SubSubcategoryListItem:
      allOf:
        - $ref: '#/components/schemas/SubSubcategory'
        - type: object
          properties:
            subcategory_name:
              type: string
              example: Door Closers
            category_name:
              type: string
              example: Architectural Hardware
            parent_name:
              type: string
              nullable: true
              example: null
    Advantage:
      type: object
      properties:
        id:
          type: integer
          example: 4
        label:
          type: string
          example: Adjustable closing speed
    Feature:
      type: object
      properties:
        id:
          type: integer
          example: 9
        title:
          type: string
          example: Hold-open arm
        image_path:
          type: string
          nullable: true
          description: The first image (kept for older data).
          example: /uploads/catalog/features/hold-open-arm-445566.jpg
        images:
          type: array
          description: All images of the feature (a carousel when there is more than one).
          items:
            type: string
          example:
            - /uploads/catalog/features/hold-open-arm-445566.jpg
            - /uploads/catalog/features/hold-open-arm-detail-778899.jpg
        description:
          type: string
          nullable: true
          example: Keeps the door open at any angle up to 150 degrees.
    SubSubcategoryDetail:
      allOf:
        - $ref: '#/components/schemas/SubSubcategory'
        - type: object
          properties:
            advantages:
              type: array
              items:
                $ref: '#/components/schemas/Advantage'
            features:
              type: array
              items:
                $ref: '#/components/schemas/Feature'
    FeatureInput:
      type: object
      required: [title]
      description: A feature without a title is skipped.
      properties:
        title:
          type: string
          example: Hold-open arm
        images:
          type: array
          items:
            type: string
          example:
            - /uploads/catalog/features/hold-open-arm-445566.jpg
        image_path:
          type: string
          description: A single image. Only used when "images" is not sent.
          example: /uploads/catalog/features/hold-open-arm-445566.jpg
        description:
          type: string
          nullable: true
          example: Keeps the door open at any angle up to 150 degrees.
    SubSubcategoryInput:
      type: object
      properties:
        name:
          type: string
          example: Overhead Door Closers
        subcategory_id:
          type: integer
          example: 5
        parent_id:
          type: integer
          nullable: true
          description: The group item to put this item in. Empty or null = top level.
          example: null
        type:
          type: string
          enum: [group, product]
          default: product
          description: Any other value is rejected (422 Invalid type).
        slug:
          type: string
          description: Optional. Made from the name when empty; must be unique inside the subcategory.
          example: overhead-door-closers
        description:
          type: string
          nullable: true
          example: Cam-action door closers for heavy doors.
        image_path:
          type: string
          nullable: true
          example: /uploads/catalog/items/overhead-door-closer-7a8b9c.jpg
        brand_logo:
          type: string
          nullable: true
          example: /uploads/brands/dorma-logo-112233.png
        sort_order:
          type: integer
          example: 1
        is_active:
          $ref: '#/components/schemas/ActiveFlag'
        advantages:
          type: array
          description: When sent, replaces all advantages. Empty labels are skipped.
          items:
            type: string
          example:
            - Adjustable closing speed
            - Fire rated
        features:
          type: array
          description: When sent, replaces all features.
          items:
            $ref: '#/components/schemas/FeatureInput'

